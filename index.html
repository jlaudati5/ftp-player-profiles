<style>
/* Layout: position tabs > grade tabs > leaderboard rail + player profile. Single dark theme on purpose: it is the FTP tool brand (matches the Game Environment board). */
:root {
  --bg: #07090f;
  --panel: #0e121c;
  --panel2: #141a27;
  --line: #212a3c;
  --text: #e8ecf5;
  --muted: #8a94ab;
  --neon: #39ff9f;
  --cyan: #2fd4ff;
  --pink: #ff3fa4;
  --amber: #ffc24b;
  --red: #ff5864;
  --neutral: #a3adc2;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --team: var(--cyan);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 60px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .5px; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(32px, 5.5vw, 44px); line-height: 1; }
h1 span { color: var(--neon); text-shadow: 0 0 18px rgba(57, 255, 159, .45); }
.sub { color: var(--muted); margin: 8px 0 20px; font-size: 13px; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand > div { min-width: 0; }
.logo { width: 64px; height: 64px; flex: none; border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 0 22px rgba(0, 200, 150, .18); }
.credit { display: flex; align-items: center; gap: 10px; margin: 26px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.credit b { color: var(--text); font-weight: 600; }
.logo-sm { width: 28px; height: 28px; flex: none; border-radius: 7px; box-shadow: 0 0 0 1px var(--line); }
@media (max-width: 560px) { .logo { width: 48px; height: 48px; border-radius: 11px; } .brand { gap: 12px; } }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font: 700 11px var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

/* nav */
.nav { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.seg { display: flex; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; width: fit-content; max-width: 100%; }
.seg button { background: none; border: 0; color: var(--muted); padding: 10px 16px; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--panel2); color: var(--neon); }
.pos button { font: 700 18px var(--display); letter-spacing: .5px; text-transform: uppercase; }
.pos button small { font: 500 11px var(--mono); color: var(--muted); }
.gradebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.gradebar .seg button { font: 600 13px var(--body); padding: 8px 14px; }
.soon { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 6px 12px; }
.spacer { flex: 1; }
.viewseg button { font: 600 12px var(--body); padding: 8px 12px; }

/* layout */
.grid { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 24px); }
.controls { display: flex; gap: 8px; }
.controls input, .controls select { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; font-size: 13px; }
.controls input { flex: 1; }
.list { overflow-y: auto; }
.row { display: grid; grid-template-columns: 24px 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.row:hover { background: var(--panel2); }
.row[aria-current="true"] { background: var(--panel2); box-shadow: inset 3px 0 0 var(--neon); }
.row .rk { font: 500 11px var(--mono); color: var(--muted); text-align: right; }
.row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tm { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sc { font: 800 22px var(--display); }
.divider { padding: 10px 12px 6px; border-bottom: 1px solid var(--line); }
.thumb { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #e9ecf2; box-shadow: 0 0 0 2px var(--team); }
.initials { display: grid; place-items: center; font: 700 14px var(--display); color: var(--bg); background: var(--team); }

/* tiers */
.t-elite { --tc: var(--neon); } .t-strong { --tc: var(--cyan); } .t-avg { --tc: var(--neutral); }
.t-weak { --tc: var(--amber); } .t-poor { --tc: var(--red); }
.tc { color: var(--tc); }

.ring { --p: 50; --tc: var(--neon); width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: conic-gradient(var(--tc) calc(var(--p) * 1%), #1c2333 0); position: relative; }
.ring::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--panel); }
.ring span { position: relative; z-index: 1; font: 800 24px var(--display); }
.ring.lg { width: 104px; height: 104px; }
.ring.lg::after { inset: 9px; }
.ring.lg span { font-size: 42px; }

/* profile */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; padding: 22px; border-bottom: 1px solid var(--line); background: linear-gradient(100deg, color-mix(in srgb, var(--team) 22%, transparent), transparent 55%); border-radius: 14px 14px 0 0; }
.hero img, .hero .initials { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; background: #e9ecf2; box-shadow: 0 0 0 4px var(--team); font-size: 36px; }
.hero h2 { font-size: clamp(32px, 5vw, 50px); line-height: .95; }
.usage { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
.chip b { color: var(--text); font: 500 12px var(--mono); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.gcard { display: flex; align-items: center; gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel2); cursor: pointer; text-align: left; }
.gcard.on { border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon) inset; }
.gcard .gl { font: 700 20px var(--display); text-transform: uppercase; letter-spacing: .5px; }
.gcard .gm { font-size: 12px; color: var(--muted); }
.gcard.empty { cursor: default; border-style: dashed; background: none; }
.gcard .ring::after { background: var(--panel2); }

.section { padding: 18px 22px; border-bottom: 1px solid var(--line); }
.section:last-child { border-bottom: 0; }
.shead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; }
.shead h3 { font-size: 22px; }
.shead p { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 62ch; }

.comp { display: grid; grid-template-columns: minmax(130px, 170px) minmax(0, 1fr) 56px 104px; gap: 6px 16px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.comp:last-child { border-bottom: 0; }
.comp .n { font-weight: 600; }
.comp .w { font: 500 11px var(--mono); color: var(--muted); }
.bar { position: relative; height: 8px; border-radius: 999px; background: #1c2333; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--tc); box-shadow: 0 0 10px color-mix(in srgb, var(--tc) 50%, transparent); }
.bar::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--muted); opacity: .7; }
.cap { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.cap b { color: var(--text); font: 500 12px var(--mono); }
.pct { font: 800 26px var(--display); text-align: right; }
.sched { justify-self: end; font: 700 11px var(--display); letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sched.tough { color: var(--neon); border-color: color-mix(in srgb, var(--neon) 45%, transparent); }
.sched.soft { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }

.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.two > .section { border-bottom: 0; }
.two > .section + .section { border-left: 1px solid var(--line); }
.trend svg { display: block; width: 100%; height: auto; }
.ctx { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 12px; }
.ctx div { display: flex; flex-direction: column; gap: 2px; }
.ctx .v { font: 800 30px/1 var(--display); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { font: 700 11px var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.l, td.l { text-align: left; }
td.l { font-family: var(--body); font-weight: 600; }
.dr { display: inline-block; min-width: 30px; margin-left: 4px; padding: 0 5px; border-radius: 6px; font-size: 11px; text-align: center; color: var(--muted); background: #1c2333; }
.dr.tough { color: var(--neon); background: color-mix(in srgb, var(--neon) 14%, transparent); }
.dr.soft { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
th button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
th button[aria-pressed="true"] { color: var(--neon); }
tr.muted td { color: var(--muted); }
.nc { font: 600 10px var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

.empty-state { padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty-state h2 { font-size: 30px; }
.empty-state p { color: var(--muted); max-width: 52ch; margin: 0; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; margin-top: 10px; }
.slots div { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; color: var(--muted); font-size: 12px; }

.method { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; color: var(--muted); font-size: 12.5px; }
.method h3 { font-size: 16px; color: var(--text); margin-bottom: 2px; }
.method p { margin: 0; max-width: 62ch; }

@media (max-width: 880px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; }
  .list { max-height: 300px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .two > .section + .section { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .hero { padding: 16px; gap: 14px; }
  .hero img, .hero .initials { width: 72px; height: 72px; }
  .section, .cards { padding-inline: 16px; }
  .comp { grid-template-columns: minmax(0, 1fr) auto; }
  .comp .barcell { grid-column: 1 / -1; grid-row: 2; }
  .comp .sched { grid-column: 1 / -1; justify-self: start; }
  .pos button { padding: 8px 12px; font-size: 16px; }
  .slots { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .35s ease; } }
</style>

const teamName = t => (TEAM[t] || [t])[0];
const teamColor = t => (TEAM[t] || [0, "#2fd4ff"])[1];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const FMT = {
  int: v => v == null ? "–" : String(Math.round(v)),
  dec1: v => v == null ? "–" : Number(v).toFixed(1),
  dec2: v => v == null ? "–" : Number(v).toFixed(2),
  signed0: v => v == null ? "–" : (v > 0 ? "+" : "") + Math.round(v),
  signed2: v => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(2),
  idx: v => v == null ? "–" : String(Math.round(v * 100)),
  pct: v => v == null ? "–" : Math.round(v * 100) + "%"
};
const fmt = (f, v) => (FMT[f] || FMT.dec2)(v);
function tier(s) {
  if (s == null) return ["t-avg", "Not graded"];
  if (s >= 80) return ["t-elite", "Elite"];
  if (s >= 65) return ["t-strong", "Strong"];
  if (s >= 35) return ["t-avg", "Average"];
  if (s >= 20) return ["t-weak", "Below average"];
  return ["t-poor", "Poor"];
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const posByKey = Object.fromEntries(DATA.positions.map(p => [p.key, p]));

const state = { pos: null, grade: null, player: null, view: "players", sort: "score", q: "", oppSort: null };

/* ---------- routing: #rb, #rb.creativity, #rb.creativity.bijan-robinson ---------- */
function readHash() {
  const [p, g, id] = location.hash.slice(1).toLowerCase().split(".");
  const firstWithGrades = DATA.positions.find(x => x.grades.length) || DATA.positions[0];
  const pos = posByKey[(p || "").toUpperCase()] || posByKey[(store.get("pp-pos") || "").toUpperCase()] || firstWithGrades;
  state.pos = pos.key;
  state.grade = (pos.grades.find(x => x.key === g) || pos.grades[0] || {}).key || null;
  state.player = id || null;
}
function writeHash() {
  const parts = [state.pos.toLowerCase()];
  if (state.grade) parts.push(state.grade);
  if (state.grade && state.player) parts.push(state.player);
  const h = "#" + parts.join(".");
  if (location.hash !== h) history.replaceState(null, "", h);
  store.set("pp-pos", state.pos);
}

const P = () => posByKey[state.pos];
const G = () => P().grades.find(g => g.key === state.grade);

function headshot(pl, cls) {
  const style = `style="--team:${teamColor(pl.team)}"`;
  if (pl.headshot) return `<img class="${cls}" ${style} src="headshots/${pl.id}.jpg" alt="" loading="lazy">`;
  const ini = pl.name.split(" ").map(w => w[0]).slice(0, 2).join("");
  return `<span class="${cls} initials" ${style} aria-hidden="true">${esc(ini)}</span>`;
}
function ring(score, cls = "") {
  const [t] = tier(score);
  return `<div class="ring ${cls} ${t}" style="--p:${score == null ? 0 : Math.max(2, score)}"><span>${score == null ? "–" : Math.round(score)}</span></div>`;
}

/* ---------- nav ---------- */
function renderNav() {
  document.getElementById("posnav").innerHTML = DATA.positions.map(p =>
    `<button role="tab" aria-selected="${p.key === state.pos}" class="${p.key === state.pos ? "on" : ""}" data-pos="${p.key}">${p.key}<small>${p.grades.length ? p.grades.length + (p.grades.length === 1 ? " grade" : " grades") : "soon"}</small></button>`).join("");
  const pos = P();
  const gb = document.getElementById("gradebar");
  if (!pos.grades.length) { gb.innerHTML = ""; return; }
  const g = G();
  gb.innerHTML = `<div class="seg" role="tablist" aria-label="${esc(pos.label)} grades">${pos.grades.map(x =>
      `<button role="tab" aria-selected="${x.key === state.grade}" class="${x.key === state.grade ? "on" : ""}" data-grade="${x.key}">${esc(x.label)}</button>`).join("")}</div>
    <span class="soon">More ${esc(pos.singular)} grades coming</span>
    <span class="spacer"></span>
    ${g.opponents ? `<div class="seg viewseg" role="tablist" aria-label="View">
      <button role="tab" class="${state.view === "players" ? "on" : ""}" data-view="players">Players</button>
      <button role="tab" class="${state.view === "opponents" ? "on" : ""}" data-view="opponents">Opponent ratings</button></div>` : ""}`;
}
document.getElementById("posnav").addEventListener("click", e => {
  const b = e.target.closest("[data-pos]"); if (!b) return;
  state.pos = b.dataset.pos; state.grade = (P().grades[0] || {}).key || null; state.player = null; state.view = "players"; state.sort = "score";
  render();
});
document.getElementById("gradebar").addEventListener("click", e => {
  const g = e.target.closest("[data-grade]"), v = e.target.closest("[data-view]");
  if (g) { state.grade = g.dataset.grade; state.sort = "score"; state.oppSort = null; if (!G().opponents) state.view = "players"; render(); }
  if (v) { state.view = v.dataset.view; render(); }
});

/* ---------- main ---------- */
function render() {
  renderNav();
  const pos = P(), main = document.getElementById("main");
  const through = DATA.through_week ? ` · through week ${DATA.through_week}` : "";
  document.getElementById("sub").textContent = `Position-by-position grades for NFL skill players · ${DATA.season} season${through}`;
  if (!pos.grades.length) { main.innerHTML = emptyPosition(pos); document.getElementById("method").innerHTML = ""; writeHash(); return; }
  if (state.view === "opponents") main.innerHTML = opponentsView();
  else { main.innerHTML = playersView(); renderList(); renderProfile(); }
  const g = G();
  document.getElementById("method").innerHTML = (g.method || []).map(([h, p]) => `<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
  writeHash();
}

function emptyPosition(pos) {
  const other = DATA.positions.filter(p => p.grades.length).map(p => `${p.key} (${p.grades.map(g => g.label).join(", ")})`).join(" · ");
  return `<div class="panel empty-state">
    <span class="label">${esc(pos.label)}</span>
    <h2>No ${esc(pos.key)} grades yet</h2>
    <p>${esc(cap(pos.singular))} grades will appear here as they are built. Each grade gets its own leaderboard and a section on every player's profile.</p>
    <div class="slots"><div>Grade slot</div><div>Grade slot</div><div>Grade slot</div></div>
    ${other ? `<p style="margin-top:10px">Live now: ${esc(other)}</p>` : ""}
  </div>`;
}

function playersView() {
  const g = G();
  return `<div class="grid">
    <aside class="rail">
      <div class="controls">
        <input id="q" type="search" placeholder="Find a player or team" aria-label="Find a player or team" value="${esc(state.q)}">
        <select id="sort" aria-label="Sort by">
          <option value="score">${esc(g.label)} grade</option>
          ${g.components.map(c => `<option value="${c.key}">${esc(c.label)}${g.has_schedule === false ? " percentile" : " rating"}</option>`).join("")}
        </select>
      </div>
      <div class="panel list" id="list" role="list"></div>
    </aside>
    <article class="panel" id="profile" aria-live="polite"></article>
  </div>`;
}

function gradeRows() {
  const g = G();
  return P().players.filter(p => p.grades[g.key]).map(p => ({ p, gr: p.grades[g.key] }));
}
function compVal(c) { return c ? (c.rating ?? c.pct) : null; }
function sortVal(r) { return state.sort === "score" ? r.gr.score : compVal(r.gr.components[state.sort]) ?? -1e9; }

function renderList() {

  const q = state.q.trim().toLowerCase();

  const rows = gradeRows().filter(match).sort((a, b) => sortVal(b) - sortVal(a));
  const qual = rows.filter(r => r.gr.qualified), small = rows.filter(r => !r.gr.qualified);

  };

  if (!rows.length) html = `<div class="divider">No player matches “${esc(state.q)}”.</div>`;
  document.getElementById("list").innerHTML = html;
  if (!state.player || !gradeRows().some(r => r.p.id === state.player)) state.player = (qual[0] || rows[0] || {}).p?.id || null;
  document.querySelectorAll(".row").forEach(r => r.dataset.id === state.player ? r.setAttribute("aria-current", "true") : r.removeAttribute("aria-current"));
}

document.getElementById("main").addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; renderList(); }
});
document.getElementById("main").addEventListener("change", e => {
  if (e.target.id === "sort") { state.sort = e.target.value; renderList(); }
});
document.getElementById("main").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (row) {
    state.player = row.dataset.id; renderList(); renderProfile(); writeHash();
    if (matchMedia("(max-width: 880px)").matches) document.getElementById("profile").scrollIntoView({ block: "start" });
    return;
  }
  const card = e.target.closest(".gcard[data-grade]");
  if (card && card.dataset.grade !== state.grade) { state.grade = card.dataset.grade; state.sort = "score"; render(); return; }
  const th = e.target.closest("th button[data-k]");
  if (th) { state.oppSort = th.dataset.k; document.getElementById("main").innerHTML = opponentsView(); }
});

/* ---------- profile ---------- */
function trendSvg(trend) {
  if (!trend || !trend.length) return `<p class="label">No ranked weeks yet.</p>`;
  const W = 420, H = 170, L = 34, R = 16, T = 16, B = 28;
  const ws = trend.map(t => t.week), x0 = Math.min(...ws), x1 = Math.max(...ws);
  const x = w => x1 === x0 ? (L + W - R) / 2 : L + (w - x0) / (x1 - x0) * (W - L - R);
  const y = v => T + (100 - v) / 100 * (H - T - B);
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#212a3c" stroke-width="1" ${v === 50 ? 'stroke-dasharray="3 3"' : ""}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#8a94ab" font-family="JetBrains Mono, monospace">${v}</text>`).join("");
  const xl = trend.map(t => `<text x="${x(t.week)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8a94ab" font-family="JetBrains Mono, monospace">W${t.week}</text>`).join("");
  const line = trend.map((t, i) => `${i ? "L" : "M"}${x(t.week).toFixed(1)},${y(t.score).toFixed(1)}`).join(" ");
  const area = `${line} L${x(trend.at(-1).week).toFixed(1)},${y(0)} L${x(trend[0].week).toFixed(1)},${y(0)} Z`;
  const last = trend.at(-1);
  const dots = trend.map((t, i) => `<circle cx="${x(t.week)}" cy="${y(t.score)}" r="${i === trend.length - 1 ? 5 : 3}" fill="${i === trend.length - 1 ? "#39ff9f" : "#0e121c"}" stroke="#39ff9f" stroke-width="2"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grade by week: ${trend.map(t => "week " + t.week + " " + Math.round(t.score)).join(", ")}">
    <defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#39ff9f" stop-opacity=".28"/><stop offset="1" stop-color="#39ff9f" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="#39ff9f" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${Math.min(x(last.week), W - R - 4)}" y="${Math.max(12, y(last.score) - 10)}" text-anchor="end" font-size="14" font-weight="700" fill="#e8ecf5" font-family="Barlow Condensed, sans-serif">${Math.round(last.score)}</text></svg>`;
}
const rankCls = r => r <= 10 ? "tough" : r >= 23 ? "soft" : "";
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";

function renderProfile() {
  const el = document.getElementById("profile");
  const pos = P(), g = G();
  const pl = pos.players.find(p => p.id === state.player);
  if (!pl) { el.innerHTML = `<div class="empty-state"><h2>No player selected</h2><p>Pick a player from the list.</p></div>`; return; }
  el.style.setProperty("--team", teamColor(pl.team));
  const gr = pl.grades[g.key];
  const [t, tlabel] = tier(gr.score);

  const cards = pos.grades.map(x => {
    const e = pl.grades[x.key];
    if (!e) return `<div class="gcard empty">${ring(null)}<div><div class="gl">${esc(x.label)}</div><div class="gm">Not graded</div></div></div>`;
    const [tt, tl] = tier(e.score);
    return `<button class="gcard ${x.key === g.key ? "on" : ""}" data-grade="${x.key}">${ring(e.score)}
      <div><div class="gl">${esc(x.label)}</div><div class="gm"><span class="${tt} tc">${tl}</span> · ${e.qualified ? `#${e.rank} of ${x.qualified_count}` : `under ${esc(x.qualifier)}`}</div></div></button>`;
  }).join("") + `<div class="gcard empty"><div class="ring" style="--p:0"><span>+</span></div><div><div class="gl">Next grade</div><div class="gm">More ${esc(pos.singular)} grades coming</div></div></div>`;

  const comps = g.components.map(c => {
    const v = gr.components[c.key] || {};
    const has = v.value != null;
    const [ct] = tier(has ? v.pct : null);
    return `<div class="comp ${ct}">
      <div><div class="n">${esc(c.label)}</div><div class="w">${Math.round(c.weight * 100)}% of grade${v.rating != null ? ` · rating ${Math.round(v.rating)}` : ""}</div></div>
      <div class="barcell"><div class="bar" aria-hidden="true"><i style="width:${has ? v.pct : 0}%"></i></div>
        <div class="cap"><span><b>${fmt(c.fmt, v.value)}</b> ${esc(c.unit)}</span><span>league ${fmt(c.fmt, c.league)}</span></div></div>
      <div class="pct tc" title="Percentile among qualified players">${has ? Math.round(v.pct) : "–"}</div>
      ${g.has_schedule === false ? "<span></span>" : `<span class="sched ${v.schedule || ""}">${v.schedule ? cap(v.schedule) + " schedule" : "No sample"}</span>`}
    </div>`;
  }).join("");

  const tables = (g.tables || []).map(spec => {
    const t = (gr.tables || []).find(x => x.key === spec.key);
    if (!t) return "";
    const hasCounted = t.rows.some(r => "counted" in r) && spec.columns.some(c => c.key === "index");
    const body = t.rows.map(r => `<tr${hasCounted && !r.counted ? ' class="muted"' : ""}><td class="l">${esc(r.label)}${hasCounted && !r.counted && r.volume ? ' <span class="nc">not counted</span>' : ""}</td>${spec.columns.map(c =>
      `<td>${fmt(c.fmt, r[c.key])}</td>`).join("")}</tr>`).join("");
    return `<section class="section"><div class="shead"><h3>${esc(spec.title)}</h3><p>${esc(spec.note || "")}</p></div>
      <div class="tablewrap"><table><thead><tr><th class="l"></th>${spec.columns.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div></section>`;
  }).join("");

  const ctx = (gr.context || []).map(([k, v]) => `<div><span class="v">${v === "" || v == null ? "–" : esc(v)}</span><span class="label">${esc(k)}</span></div>`).join("");
  const cols = g.log_columns || [];
  const log = (gr.log || []).map(r => `<tr><td class="l">W${r.week}</td><td class="l"><span class="dot" style="background:${teamColor(r.opp)}"></span>${r.opp}</td>${cols.map(c =>
      `<td>${fmt(c.fmt, r.vals[c.key])}${c.rank && r.ranks && r.ranks[c.key] ? `<span class="dr ${rankCls(r.ranks[c.key])}" title="${r.opp} rank vs ${esc(c.label)}">#${r.ranks[c.key]}</span>` : ""}</td>`).join("")}</tr>`).join("");

  el.innerHTML = `
    <div class="hero">
      ${headshot(pl, "")}
      <div style="min-width:0">
        <div class="label">${esc(teamName(pl.team))}${pl.jersey ? " · #" + esc(pl.jersey) : ""} · ${esc(pos.key)}</div>
        <h2>${esc(pl.name)}</h2>
        <div class="usage">${pl.games ? `<span class="chip"><b>${pl.games}</b> games</span>` : ""}${(pl.usage || []).map(([k, v]) => `<span class="chip"><b>${v}</b> ${esc(k.toLowerCase())}</span>`).join("")}
          ${gr.schedule ? `<span class="chip">Overall schedule <b class="${gr.schedule === "tough" ? "t-elite" : gr.schedule === "soft" ? "t-weak" : "t-avg"} tc">${gr.schedule}</b></span>` : ""}</div>
      </div>
    </div>
    <div class="cards" aria-label="Grades">${cards}</div>
    <section class="section">
      <div class="shead"><h3>${esc(g.label)} breakdown</h3><p>${esc(g.tagline)} Bars show percentile among players with ${esc(g.qualifier)}; the tick is the 50th.</p></div>
      ${comps}
    </section>
    <div class="two">
      <section class="section trend"><div class="shead"><h3>${esc(g.label)} by week</h3><p>${esc(g.trend_note || "Grade after each game, against that week's field.")}</p></div>${trendSvg(gr.trend)}</section>
      ${ctx ? `<section class="section"><div class="shead"><h3>${esc(g.context_title || "Context")}</h3><p>Not part of the grade.</p></div><div class="ctx">${ctx}</div></section>` : ""}
    </div>
    ${log ? `<section class="section"><div class="shead"><h3>Game log</h3><p>Chip is the opponent's current rank against that stat. Green is a top-10 defense, amber is bottom-10.</p></div>
      <div class="tablewrap"><table><thead><tr><th class="l">Wk</th><th class="l">Opp</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${log}</tbody></table></div></section>` : ""}
    ${tables}`;
}

/* ---------- opponents ---------- */
function opponentsView() {
  const g = G(), o = g.opponents;
  const k = state.oppSort || g.components[0].key;
  const rows = [...o.rows].sort((a, b) => a.ranks[k] - b.ranks[k]);
  return `<div class="panel"><div class="section">
    <div class="shead"><h3>${esc(o.title)}</h3><p>${esc(o.note)}</p></div>
    <div class="tablewrap"><table>
      <thead><tr><th class="l">Team</th>${g.components.map(c => `<th><button data-k="${c.key}" aria-pressed="${c.key === k}">${esc(c.label)}${c.key === k ? " ▲" : ""}</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr><td class="l"><span class="dot" style="background:${teamColor(r.team)}"></span>${esc(teamName(r.team))}</td>${g.components.map(c =>
        `<td><span class="dr ${rankCls(r.ranks[c.key])}">#${r.ranks[c.key]}</span><div style="font-size:11px;color:var(--muted)">${fmt(c.fmt, r.allowed[c.key])}</div></td>`).join("")}</tr>`).join("")}</tbody>
    </table></div></div></div>`;
}

window.addEventListener("hashchange", () => { readHash(); state.view = "players"; render(); });
readHash();
render();
</script>

</body>
</html>
